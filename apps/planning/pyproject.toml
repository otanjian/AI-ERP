[project]
name = "planning"
authors = [
    { name = "Bosofts", email = "support@example.com" }
]
description = "Third-party Planning and MRP app for ERPNext v16"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://example.com"

[tool.setuptools.dynamic]
version = { attr = "planning.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["planning*"]
