upstream frappe-bench-frappe {
	server 127.0.0.1:8000 fail_timeout=0;
}

upstream frappe-bench-socketio-server {
	server 127.0.0.1:9000 fail_timeout=0;
}

# Socket.IO: use "upgrade" only when the client sends Upgrade (WebSocket). Long-polling
# requests must use Connection: close or Nginx holds connections incorrectly → multi‑second delays.
map $http_upgrade $frappe_connection_upgrade {
	default upgrade;
	''      close;
}

# setup maps


# server blocks





server {
	
	listen 80;
	listen [::]:80;
	

	server_name
		west.bosofts.com
		erp.bosofts.com
		;

	# Always use HTTPS for this host (avoids "Not secure" when users open http://...).
	return 301 https://$host$request_uri;

	root /home/frappe/frappe-bench/sites;

	

	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;

	

	add_header X-Frame-Options "SAMEORIGIN";
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
	add_header X-Content-Type-Options nosniff;
	add_header X-XSS-Protection "1; mode=block";
	add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin";

	location /assets {
		open_file_cache max=20000 inactive=30s;
		open_file_cache_valid 60s;
		open_file_cache_min_uses 2;
		open_file_cache_errors off;
		try_files $uri =404;
		add_header Cache-Control "max-age=31536000";
	}

	location ~ ^/protected/(.*) {
		internal;
		try_files /west.bosofts.com/$1 =404;
	}

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $frappe_connection_upgrade;
		proxy_set_header X-Frappe-Site-Name west.bosofts.com;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header Origin $scheme://$http_host;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_buffering off;
		proxy_read_timeout 86400;
		proxy_send_timeout 86400;

		proxy_pass http://frappe-bench-socketio-server;
	}

	location = /bowiai {
		return 301 /bowiai/;
	}

	location /bowiai/ {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $frappe_connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 300;
		proxy_send_timeout 300;
		proxy_pass http://127.0.0.1:3000/;
	}

	location ^~ /_next/ {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $frappe_connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 300;
		proxy_send_timeout 300;
		proxy_pass http://127.0.0.1:3000;
	}

	location = /api/models {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 300;
		proxy_send_timeout 300;
		proxy_pass http://127.0.0.1:3000;
	}

	location ^~ /api/chat {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 300;
		proxy_send_timeout 300;
		proxy_pass http://127.0.0.1:3000;
	}

	location / {

 		rewrite ^(.+)/$ $1 permanent;
  		rewrite ^(.+)/index\.html$ $1 permanent;
  		rewrite ^(.+)\.html$ $1 permanent;

		location ~* ^/files/.*.(htm|html|svg|xml) {
			add_header Content-disposition "attachment";
			try_files /west.bosofts.com/public/$uri @webserver;
		}

		try_files /west.bosofts.com/public/$uri @webserver;
	}

	location @webserver {
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Frappe-Site-Name west.bosofts.com;
		proxy_set_header Host $host;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;

		proxy_pass  http://frappe-bench-frappe;
	}

	# error pages
	error_page 502 /502.html;
	location /502.html {
		root /usr/local/lib/python3.12/dist-packages/bench/config/templates;
		internal;
	}

	

	# optimizations
	sendfile on;
	keepalive_timeout 15;
	client_max_body_size 50m;
	client_body_buffer_size 16K;
	client_header_buffer_size 1k;

	# enable gzip compresion
	# based on https://mattstauffer.co/blog/enabling-gzip-on-nginx-servers-including-laravel-forge
	gzip on;
	gzip_http_version 1.1;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_vary on;
	gzip_types
		application/atom+xml
		application/javascript
		application/json
		application/rss+xml
		application/vnd.ms-fontobject
		application/x-font-ttf
		application/font-woff
		application/x-web-app-manifest+json
		application/xhtml+xml
		application/xml
		font/opentype
		image/svg+xml
		image/x-icon
		text/css
		text/plain
		text/x-component
		;
		# text/html is always compressed by HttpGzipModule
}

# HTTP → HTTPS www (except ACME / DV file validation on port 80)
server {
	listen 80;
	listen [::]:80;

	server_name bosofts.com www.bosofts.com;

	root /home/website/wwwroot;

	location ^~ /.well-known/pki-validation/ {
		default_type text/plain;
		try_files $uri =404;
	}

	location / {
		return 301 https://www.bosofts.com$request_uri;
	}
}

# HTTPS bosofts.com (apex) → www.bosofts.com
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name bosofts.com;

	ssl_certificate     /home/frappe/frappe-bench/config/ssl/www.bosofts.com.crt;
	ssl_certificate_key /home/frappe/frappe-bench/config/ssl/www.bosofts.com.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	return 301 https://www.bosofts.com$request_uri;
}

# HTTPS www.bosofts.com — Empire CMS site at /home/website/wwwroot
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	server_name www.bosofts.com;

	ssl_certificate     /home/frappe/frappe-bench/config/ssl/www.bosofts.com.crt;
	ssl_certificate_key /home/frappe/frappe-bench/config/ssl/www.bosofts.com.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL_www_bosofts:20m;
	ssl_session_timeout 1d;
	ssl_session_tickets on;

	root /home/website/wwwroot;
	index index.html index.htm index.php;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
	add_header X-Content-Type-Options nosniff;
	add_header X-XSS-Protection "1; mode=block";
	add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin";

	client_max_body_size 50m;

	# Large MP4: byte-range friendly, cache, no gzip on binary
	location ^~ /video/ {
		gzip off;
		sendfile on;
		tcp_nopush on;
		open_file_cache max=512 inactive=30s;
		open_file_cache_valid 60s;
		open_file_cache_errors off;
		add_header Accept-Ranges bytes always;
		expires 30d;
		add_header Cache-Control "public, max-age=2592000";
	}

	location ~* ^/e/(data|config|class|tasks)/ {
		deny all;
	}

	location ^~ /.well-known/pki-validation/ {
		default_type text/plain;
		try_files $uri =404;
	}

	location ~ /\. {
		deny all;
	}

	# Bowi AI 客服增长平台 — document root: chatAI/public
	location = /chatAI {
		return 301 /chatAI/;
	}

	location = /chatAI/public {
		return 301 /chatAI/;
	}

	location = /chatAI/public/index.php {
		return 301 /chatAI/;
	}

	location ^~ /chatAI/public/ {
		rewrite ^/chatAI/public/(.*)$ /chatAI/$1 permanent;
	}

	# chatAI 模板使用根路径 /assets/…
	location ^~ /assets/ {
		alias /home/website/wwwroot/chatAI/public/assets/;
		expires 30d;
		add_header Cache-Control "public, max-age=2592000";
	}

	location ^~ /chatAI/ {
		alias /home/website/wwwroot/chatAI/public/;
		index index.php index.html;

		location ~ \.php$ {
			include snippets/fastcgi-php.conf;
			fastcgi_pass unix:/run/php/php8.3-fpm.sock;
			fastcgi_param SCRIPT_FILENAME $request_filename;
		}
	}

	location / {
		try_files $uri $uri/ =404;
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php8.3-fpm.sock;
	}

	sendfile on;
	keepalive_timeout 15;

	gzip on;
	gzip_http_version 1.1;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_vary on;
	gzip_types
		application/atom+xml
		application/javascript
		application/json
		application/rss+xml
		application/vnd.ms-fontobject
		application/x-font-ttf
		application/font-woff
		application/x-web-app-manifest+json
		application/xhtml+xml
		application/xml
		font/opentype
		image/svg+xml
		image/x-icon
		text/css
		text/plain
		text/x-component
		;
}

